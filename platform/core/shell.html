<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игры</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --accent: #2f6fed; --border: #e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171b; --card: #1d2126; --text: #e8eaed; --muted: #98a2b3; --accent: #6b9bff; --border: #2c3138; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; }
  .balance { font-weight: 600; font-variant-numeric: tabular-nums; }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  a.game { display: block; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 600; }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); }
  .muted { color: var(--muted); }
  .error { color: #d92d20; }
</style>
</head>
<body>
<header>
  <h1>Игры</h1>
  <div>Баланс: <span class="balance" data-testid="balance">…</span></div>
</header>
<main>
  <p class="muted" data-testid="status">Загрузка…</p>
  <ul data-testid="games"></ul>
</main>
<script>
  (function () {
    var status = document.querySelector('[data-testid="status"]');
    var list = document.querySelector('[data-testid="games"]');
    var balance = document.querySelector('[data-testid="balance"]');
    function money(x) { return '$' + Number(x).toFixed(2); }
    function json(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); }

    fetch('/api/games').then(json).then(function (games) {
      status.textContent = games.length ? '' : 'Игр пока нет';
      status.hidden = games.length > 0;
      games.forEach(function (g) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'game';
        a.href = '/games/' + encodeURIComponent(g.id) + '/';
        a.textContent = g.title;
        a.setAttribute('data-testid', 'game-' + g.id);
        li.appendChild(a);
        list.appendChild(li);
      });
    }).catch(function () {
      status.textContent = 'Не удалось загрузить список игр';
      status.className = 'error';
    });

    fetch('/api/balance').then(json).then(function (r) {
      balance.textContent = money(r.balance);
    }).catch(function () {
      balance.textContent = 'недоступен';
    });
  })();
</script>
</body>
</html>
